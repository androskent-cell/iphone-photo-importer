# Compila iPhonePhotoImporter.exe en cada cambio.
# Al subir una etiqueta vX.Y.Z, publica una versión (Release) con el .exe para descargar.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: iPhonePhotoImporter
          path: iPhonePhotoImporter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" iPhonePhotoImporter.exe \
            --title "iPhone Photo Importer $GITHUB_REF_NAME" \
            --generate-notes
